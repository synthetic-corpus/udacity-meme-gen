apiVersion: v1
kind: Service
metadata:
  name: meme-generator-service
  labels:
    app: meme-generator
  annotations:
    # nlb-ip registers pod IPs on targetPort (5000). The plain "nlb" type uses the
    # in-tree controller which ignores nlb-target-type: ip and falls back to
    # instance/NodePort mode (e.g. 30702), which our security group does not allow.
    service.beta.kubernetes.io/aws-load-balancer-type: nlb-ip
    service.beta.kubernetes.io/aws-load-balancer-scheme: internet-facing
    service.beta.kubernetes.io/aws-load-balancer-cross-zone-load-balancing-enabled: "true"
    service.beta.kubernetes.io/aws-load-balancer-healthcheck-port: "5000"
spec:
  type: LoadBalancer
  ports:
  - port: 80
    targetPort: 5000
    protocol: TCP
    name: http
  selector:
    app: meme-generator
