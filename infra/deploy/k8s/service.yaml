apiVersion: v1
kind: Service
metadata:
  name: meme-generator-service
  labels:
    app: meme-generator
  annotations:
    # AWS Load Balancer Controller provisions an NLB with IP targets (pod IPs on
    # targetPort 5000). "external" + nlb-target-type:ip is the current AWS-recommended
    # form; legacy nlb-ip is still supported but not preferred for new LBs.
    service.beta.kubernetes.io/aws-load-balancer-type: external
    service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: ip
    service.beta.kubernetes.io/aws-load-balancer-scheme: internet-facing
    service.beta.kubernetes.io/aws-load-balancer-cross-zone-load-balancing-enabled: "true"
    service.beta.kubernetes.io/aws-load-balancer-healthcheck-port: "5000"
spec:
  type: LoadBalancer
  ports:
  - port: 80
    targetPort: 5000
    protocol: TCP
    name: http
  selector:
    app: meme-generator
