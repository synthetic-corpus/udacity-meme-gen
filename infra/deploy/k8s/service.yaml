apiVersion: v1
kind: Service
metadata:
  name: meme-generator-service
  labels:
    app: meme-generator
  annotations:
    # Use EKS built-in service controller (not AWS Load Balancer Controller).
    # "external" requires the separate LBC install; "nlb" provisions via the cloud controller.
    service.beta.kubernetes.io/aws-load-balancer-type: nlb
    service.beta.kubernetes.io/aws-load-balancer-scheme: internet-facing
    service.beta.kubernetes.io/aws-load-balancer-cross-zone-load-balancing-enabled: "true"
spec:
  type: LoadBalancer
  ports:
  - port: 80
    targetPort: 5000
    protocol: TCP
    name: http
  selector:
    app: meme-generator
